version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: classica-rabbitmq
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - classica-network

  maildev:
    image: maildev/maildev:latest
    container_name: classica-maildev
    ports:
      - "1080:1080"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_WEB_PORT: 1080
    networks:
      - classica-network

volumes:
  rabbitmq_data:

networks:
  classica-network:
    driver: bridge

