# Development Profile Configuration
spring.application.name=recupera-psswd

# RabbitMQ Configuration (Local Development)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# Email Configuration (Using MailDev for Testing)
# MailDev is a test SMTP server that captures emails
# Web UI: http://localhost:1080
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.from=noreply@classica-moveis.com
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Application Configuration
app.api.url=http://localhost:8080

# Logging (Debug)
logging.level.root=INFO
logging.level.ms.recupera_psswd=DEBUG
logging.level.org.springframework.amqp=DEBUG

# Server
server.port=8080

